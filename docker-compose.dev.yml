services:
  nextjs:
    build:
      dockerfile: ./docker/nextjs/Dockerfile.dev
    environment:
      SOLR_HOST: solr
      API_URL_LIVE: "${API_URL_LIVE:-https://sta.dnb.de}"
      API_URL_PROD: "${API_URL_PROD:-https://edit.sta.dnb.de}"
      API_URL_TEST: "${API_URL_TEST:-http://lab.sta.dnb.de}"
    working_dir: /srv
    ports:
      - '3000:3000'
    depends_on:
      - solr
    volumes:
      # Mount the local project into the container
      - .:/srv
      # Keep container-installed dependencies
      - /srv/node_modules

  solr:
    ports:
      - '8983:8983'
    user: '8983:8983'
