services:
  nextjs:
    build:
      dockerfile: ./docker/nextjs/Dockerfile.prod
    environment:
      - SOLR_HOST=solr
    extra_hosts:
      - "edit.sta.dnb.de:10.10.14.210"
      # - "lab.sta.dnb.de:10.10.14.226"
    networks:
      dnb-wikibase_default:
        aliases:
          - next.svc

  solr:
    ports:
      - '127.0.0.1:8983:8983'
    user: '8983:8983'
    networks:
      dnb-wikibase_default:

networks:
  dnb-wikibase_default:
    external: true