services:
  nextjs:
    build:
      dockerfile: ./docker/nextjs/Dockerfile.prod
    environment:
      SOLR_HOST: solr
      API_URL_LIVE: "${API_URL_LIVE:-https://sta.dnb.de}"
      API_URL_PROD: "${API_URL_PROD:-https://edit.sta.dnb.de}"
      API_URL_TEST: "${API_URL_TEST:-http://lab.sta.dnb.de}"
    networks:
      dnb-wikibase_default:
        aliases:
          - next.svc

  solr:
    ports:
      - '127.0.0.1:8983:8983'
    user: '8983:8983'
    networks:
      dnb-wikibase_default:

networks:
  dnb-wikibase_default:
    external: true