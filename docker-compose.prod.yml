services:
  nextjs:
    build:
      dockerfile: ./docker/nextjs/Dockerfile.prod
    environment:
      - SOLR_HOST=solr
    extra_hosts:
      # Hostname comes from NEXT_PUBLIC_URL (npm run docker:up); IP from IP_ADDRESS.
      - "${MEDIAWIKI_HOST}:${IP_ADDRESS}"
    networks:
      dnb-wikibase_default:
        aliases:
          - next.svc

  solr:
    ports:
      - '127.0.0.1:8983:8983'
    user: '8983:8983'
    networks:
      dnb-wikibase_default:

networks:
  dnb-wikibase_default:
    external: true